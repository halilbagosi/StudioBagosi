name = "studio-bagosi"
main = "src/index.js"
compatibility_date = "2024-06-01"

# Development environment
[env.development]
workers_dev = true

# Production environment  
[env.production]
workers_dev = false
routes = [
  "studiobagosi.com/*",
  "www.studiobagosi.com/*"
]

# D1 Database bindings (will be populated after creation)
[[d1_databases]]
binding = "DB"
database_name = "studio-bagosi-prod"
database_id = "" # Will be filled after d1 create

# R2 Storage bindings (will be populated after creation)  
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "studio-bagosi-images"

# Environment variables
[vars]
ENVIRONMENT = "development"

# Production variables (set via wrangler secret put)
# JWT_SECRET - for authentication
# ADMIN_EMAIL - for notifications 